[isp]
; This file contains the ISP settings for the camera module.
; Adjust the settings below to configure the ISP parameters.
noise_reduction=4
ldc=1
detail_enhancement=4
three_dnr=1
mirror=1
flip=1
; Indoor-outdoor mode -> Auto
in_out_door_mode=2
dehaze=1
; The adc_cutoff value is used to adjust when night mode is activated.
adc_cutoff=400
adc_cutoff_inverted=2750
invert_ir_cut=0
brightness=1
contrast=50
hue=0
saturation=50
sharpness=50
gamma=300
backlight_compensation=1
power_line_frequency=1
exposure_auto=0
exposure_auto_priority=0
zoom_absolute=0
; Wide-dynamic range -> auto
wdr_mode=2
wdr_level=40
wb_green=256
wb_blue=256
wb_red=256
; Smart IR mode -> auto
smart_ir_mode=1
smart_ir_manual_level=50

[encoder]
; This section contains settings for the video encoder.
max_bitrate=1024000
min_bitrate=512000
width=1920
height=1080
fps=20

[rtsp]
; RTSP settings for the camera stream.
; You can leave the user and password empty for no authentication.
username=
password=
port=554
name=stream

