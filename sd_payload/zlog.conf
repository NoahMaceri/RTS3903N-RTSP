[global]
strict init = true
buffer min = 1024
buffer max = 64KB
rotate lock file = /tmp/zlog.lock
default format ="%d(%F %T) [%-5V]: %m%n"

[formats]
server_f  = "%d(%F %T) [%-5V] [RTSP server]: %m%n"
imager_f  = "%d(%F %T) [%-5V] [Imager streamer]: %m%n"
isp_adj_f = "%d(%F %T) [%-5V] [ISP Adjustment]: %m%n"
onvif_f   = "%d(%F %T) [%-5V] [ONVIF]: %m%n"

[rules]
server.INFO     "/var/log/rtsp_streamer.log", 256KB * 3; server_f
imager.INFO     "/var/log/rtsp_streamer.log", 256KB * 3; imager_f
isp_adj.INFO    "/var/log/rtsp_streamer.log", 256KB * 3; isp_adj_f
isp_adj.*       >stdout; isp_adj_f
onvif.INFO      "/var/log/rtsp_streamer.log", 256KB * 3; onvif_f