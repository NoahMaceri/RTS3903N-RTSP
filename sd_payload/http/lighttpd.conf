server.document-root = "/var/tmp/sd/http/www"
server.port = 80
static-file.exclude-extensions = ( ".fcgi", ".php", ".rb", "~", ".inc" )
index-file.names = ( "index.html" )

# Enable CGI module
server.modules += ( "mod_cgi", "mod_alias" )

# Configure CGI bin directory
alias.url += ( "/cgi-bin/" => "/var/tmp/sd/http/cgi-bin/" )
$HTTP["url"] =~ "^/cgi-bin/" {
        cgi.assign = ( "" => "" )
}

# ONVIF SOAP services. Each /onvif/<service> URL maps to a small dispatcher
# script in /tmp/onvif/ (created at boot by config.sh) which exec's
# onvif_simple_server with the right service name as its last argv. Lives
# in tmpfs so the FAT32 SD card doesn't break exec bits / symlinks.
alias.url += ( "/onvif/" => "/tmp/onvif/" )
$HTTP["url"] =~ "^/onvif/" {
        cgi.assign = ( "" => "" )
}
