server.document-root = "/var/tmp/sd/http/www"
server.port = 80
static-file.exclude-extensions = ( ".fcgi", ".php", ".rb", "~", ".inc" )
index-file.names = ( "index.html" )

# Enable CGI module
server.modules += ( "mod_cgi", "mod_alias" )

# Configure CGI bin directory
alias.url += ( "/cgi-bin/" => "/var/tmp/sd/http/cgi-bin/" )
$HTTP["url"] =~ "^/cgi-bin/" {
        cgi.assign = ( "" => "" )
}
