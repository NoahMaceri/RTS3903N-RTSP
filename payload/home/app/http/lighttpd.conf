server.document-root = "/home/app/http/www"
server.port = 80
static-file.exclude-extensions = ( ".fcgi", ".php", ".rb", "~", ".inc" )
index-file.names = ( "index.html" )

server.modules += ( "mod_cgi", "mod_alias" )

alias.url += ( "/cgi-bin/" => "/home/app/http/cgi-bin/" )
$HTTP["url"] =~ "^/cgi-bin/" {
        cgi.assign = ( "" => "" )
}

# ONVIF dispatcher scripts get written to /tmp/onvif/ at boot (tmpfs, so
# they keep exec bits). Same arrangement as the SD-card flow.
alias.url += ( "/onvif/" => "/tmp/onvif/" )
$HTTP["url"] =~ "^/onvif/" {
        cgi.assign = ( "" => "" )
}
