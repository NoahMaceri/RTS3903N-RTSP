# RTS3903N IP camera — network configuration
# ============================================
#
# Read at every boot by /var/tmp/sd/wifi/config.sh, which turns it into a
# generated wpa_supplicant.conf and (optionally) a static-IP setup. Edit
# this file, save to the root of the SD card, and reboot the camera. You
# never need to touch config.sh.
#
# Lines beginning with `#` or `;` are comments. Whitespace around `=` is
# ignored. Section names are case-sensitive.

[wifi]
# Your WiFi SSID and pre-shared key (WPA/WPA2-PSK). For an open network
# leave psk empty. Special characters: avoid `"` and `\` in psk — they'll
# break the generated wpa_supplicant config. If you need them, edit
# wifi/wpa_supplicant.conf manually after first boot, but be aware this
# file will overwrite it on the next reboot.
ssid=YourNetworkName
psk=YourWiFiPassword

# Optional. Regulatory country code (ISO 3166-1 alpha-2 — e.g. US, GB, DE).
# Sets the 2.4 GHz channel set + max TX power the driver is allowed to use.
# Leave empty to keep the driver's compiled-in default (usually worldwide /
# permissive). Wrong country can manifest as the AP appearing in scans but
# never associating, or sudden link drops on channels 12–14.
country=

# Optional. Prefer a specific AP by BSSID (e.g. aa:bb:cc:dd:ee:ff). Useful
# when your SSID is served by multiple APs (mesh / extenders) and the
# camera keeps roaming between them mid-stream. Emitted as `bssid_hint=`
# (soft preference) — wpa_supplicant prefers this AP but falls back to
# any other AP matching the SSID if the hinted one is unreachable, so a
# momentarily-down AP won't lock the camera off the network. Leave empty
# to let wpa_supplicant pick freely.
bssid=

[network]
# Static IP configuration. All three of `ip`, `netmask`, and `gateway` must
# be set for the static path to be used; if any is empty the camera falls
# back to DHCP. Recommended for RTSP — avoids the periodic udhcpc lease
# renewal that can briefly drop the link mid-stream. Examples:
#   ip      = 192.168.1.100
#   netmask = 255.255.255.0
#   gateway = 192.168.1.1
ip=
netmask=
gateway=
