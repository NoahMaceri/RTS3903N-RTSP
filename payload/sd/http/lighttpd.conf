# Minimal CGI-only config: /cgi-bin/snapshot for ONVIF snapshot, /onvif/
# for the SOAP services. document-root is required by lighttpd 1.4.83 even
# when no static files are served; we point it at the cgi-bin dir for
# convenience.
server.port = 80
server.document-root = "/var/tmp/sd/http/"
server.modules += ( "mod_cgi", "mod_alias" )

alias.url += ( "/cgi-bin/" => "/var/tmp/sd/http/cgi-bin/" )
$HTTP["url"] =~ "^/cgi-bin/" {
        cgi.assign = ( "" => "" )
}

alias.url += ( "/onvif/" => "/tmp/onvif/" )
$HTTP["url"] =~ "^/onvif/" {
        cgi.assign = ( "" => "" )
}
