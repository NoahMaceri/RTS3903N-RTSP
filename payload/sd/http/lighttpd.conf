# Minimal CGI-only config: /cgi-bin/snapshot for ONVIF snapshot, /onvif/
# for the SOAP services. No static document root.
server.port = 80
server.modules += ( "mod_cgi", "mod_alias" )

alias.url += ( "/cgi-bin/" => "/var/tmp/sd/http/cgi-bin/" )
$HTTP["url"] =~ "^/cgi-bin/" {
        cgi.assign = ( "" => "" )
}

alias.url += ( "/onvif/" => "/tmp/onvif/" )
$HTTP["url"] =~ "^/onvif/" {
        cgi.assign = ( "" => "" )
}
